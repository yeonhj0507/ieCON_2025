title: CoolDrinx Global Supply-Chain Challenge
short_description: 3-month demand-forecast & supply-chain optimization contest
description: templates/description.html
evaluation_details: templates/evaluation_details.html
terms_and_conditions: templates/terms_and_conditions.html
image: logo.jpg                # 로고 확정 전, 파일만 placeholder
submission_guidelines: templates/submission_guidelines.html
leaderboard_description: 통합 점수(수요예측 40 % + 총비용 60 %) 기준 리더보드
evaluation_script: evaluation_script.zip
remote_evaluation: False

# 전체 대회 기간
start_date: 2025-06-30 00:00:00
end_date:   2025-08-26 23:59:59
published: True

tags:
  - supply-chain
  - demand-forecasting
  - optimization
  - operations-research

# ───────── Leaderboard ─────────
leaderboard:
  - id: 1
    schema: |
      {
        "labels": ["WAPE(%)", "TotalCost(USD)", "WeightedScore"],
        "default_order_by": "WeightedScore",
        "metadata": {
          "WAPE(%)": {
            "sort_ascending": true,
            "description": "Phase 1 수요예측 지표(WAPE)"
          },
          "TotalCost(USD)": {
            "sort_ascending": true,
            "description": "Phase 2 총비용"
          },
          "WeightedScore": {
            "sort_ascending": false,
            "description": "0.4×Phase1 + 0.6×Phase2"
          }
        }
      }

# ───────── Challenge Phases ─────────
challenge_phases:
  - id: 1
    name: Phase 1 – Demand Forecast
    description: templates/challenge_phase_1_description.html
    leaderboard_public: False          # 2023년 구간만 공개
    is_public: True
    is_active: True
    start_date: 2025-06-30 00:00:00    # TODO: 수정 가능
    end_date:   2025-07-25 23:59:59    # TODO: 확정 필요
    max_submissions_per_day: 2
    max_submissions_per_month: 60
    max_submissions: 120
    max_concurrent_submissions_allowed: 3
    test_annotation_file: annotations/test_annotations_devsplit.json
    codename: demand
    allowed_submission_file_types: ".csv"

  - id: 2
    name: Phase 2 – Production & Logistics Plan
    description: templates/challenge_phase_2_description.html
    leaderboard_public: True
    is_public: True
    is_active: True
    start_date: 2025-07-26 00:00:00    # TODO: 확정 필요
    end_date:   2025-08-26 23:59:59
    max_submissions_per_day: 1
    max_submissions_per_month: 20
    max_submissions: 40
    max_concurrent_submissions_allowed: 3
    test_annotation_file: annotations/test_annotations_testsplit.json
    codename: plan
    allowed_submission_file_types: ".csv"

# ───────── Dataset Splits ─────────
dataset_splits:
  - id: 1
    name: Public Eval Split (2023)
    codename: pub_eval
  - id: 2
    name: Private Eval Split (2024)
    codename: priv_eval

# ───────── Phase ↔ Split ─────────
challenge_phase_splits:
  - challenge_phase_id: 1
    leaderboard_id: 1
    dataset_split_id: 1
    visibility: 1
    leaderboard_decimal_precision: 3
    is_leaderboard_order_descending: False
    show_execution_time: True
    show_leaderboard_by_latest_submission: True

  - challenge_phase_id: 2
    leaderboard_id: 1
    dataset_split_id: 2
    visibility: 1
    leaderboard_decimal_precision: 2
    is_leaderboard_order_descending: False
    show_execution_time: True
    show_leaderboard_by_latest_submission: True
